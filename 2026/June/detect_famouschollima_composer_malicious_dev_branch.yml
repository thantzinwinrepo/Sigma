title: Famous Chollima - Composer Install of Malicious Dev Branch
id: 5f7b9c12-4567-8901-23de-f01234567890
status: experimental
description: Detects composer requiring the specific malicious dev branch used in the Famous Chollima Contagious Interview lure targeting PHP developers. Cross-platform — covers Windows, macOS, Linux, and Docker containers.
references:
    - https://socket.dev/blog/famous-chollima-targets-php-developers-through-compromised-packagist-package
author: Thant Zin Win
date: 2026-06-07
tags:
    - attack.initial_access
    - attack.t1195.002
    - attack.execution
    - attack.t1204.002
logsource:
    category: process_creation
detection:
    selection_main:
        Image|endswith:
            - '\php.exe'
            - '/php'
            - '\composer.bat'
            - '\composer.exe'
            - '/composer'
            - 'composer.phar'
        CommandLine|contains|all:
            - 'require'
            - 'roberts/leads'
            - 'dev-drewroberts'
    condition: selection_main
falsepositives:
    - None — this exact package/branch combination is malicious
fields:
    - CommandLine
    - ParentCommandLine
    - User
level: critical
