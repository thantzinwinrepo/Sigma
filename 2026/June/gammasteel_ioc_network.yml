title: GammaSteel - Known Operator-Controlled C2 Infrastructure
id: 9b1e3f7d-2a5c-4b91-b9d7-a3f8c1e4b6d2
status: experimental
description: Detects network connections to GammaSteel's hardcoded operator-controlled infrastructure including the primary fallback C2 domain justsstop.ru, IP 165.22.170.129, and actor-controlled domains norosta.ru and selltosell.ru subdomains used as staging resolvers.
author: Thant Zin Win
date: 2026-06-10
modified: 2026-06-10
references:
  - https://blog.sekoia.io/fsbs-matryoshka-3-3-gamaredons-gifts-that-keeps-unpacking-gammasteel/
logsource:
  category: network_connection
  product: windows
detection:
  selection_c2_domains:
    DestinationHostname|endswith:
      - 'justsstop.ru'
      - 'norosta.ru'
      - 'selltosell.ru'
  selection_c2_ip:
    DestinationIp: '165.22.170.129'
  condition: selection_c2_domains or selection_c2_ip
falsepositives:
  - None expected; these are confirmed Gamaredon operational infrastructure indicators as of January-February 2026
level: critical
tags:
  - attack.command_and_control
  - attack.t1071
  - attack.exfiltration
  - attack.t1041
fields:
  - DestinationHostname
  - DestinationIp
  - DestinationPort
  - Image
  - User
