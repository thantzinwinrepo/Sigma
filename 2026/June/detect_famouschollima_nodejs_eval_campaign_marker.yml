title: Famous Chollima - Node.js Execution with Campaign Marker
id: 2c4e6f80-1234-5678-90ab-cdef01234567
status: experimental
description: Detects Node.js executed with inline eval containing the Famous Chollima campaign version marker global._V or variants. Splits global scope and variable name into separate selections to catch dot notation, bracket notation, double quotes, globalThis, and this._V bypass variants.
references:
    - https://socket.dev/blog/famous-chollima-targets-php-developers-through-compromised-packagist-package
author: Thant Zin Win
date: 2026-06-07
modified: 2026-06-07
tags:
    - attack.execution
    - attack.t1059.007
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
detection:
    selection_image:
        Image|endswith:
            - '\node.exe'
            - '/node'
    selection_flags:
        CommandLine|contains:
            - ' -e '
            - ' --eval '
            - ' -p '
            - ' --print '
    selection_marker_global:
        CommandLine|contains:
            - 'global'
            - 'globalThis'
            - 'this'
    selection_marker_variable:
        CommandLine|contains:
            - '_V'
    condition: selection_image and selection_flags and selection_marker_global and selection_marker_variable
falsepositives:
    - None known
fields:
    - CommandLine
    - ParentCommandLine
    - ParentImage
level: critical
