title: GammaSteel - FileSystemWatcher Deployed for Real-Time Document Surveillance
id: 2b4c8e6f-7d1a-4f95-b3c2-a6e4f1d7c8b2
status: experimental
description: Detects GammaSteel creating a System.IO.FileSystemWatcher with recursive subdirectory monitoring to capture documents at the moment they are saved or modified across all fixed drives.
author: Thant Zin Win
date: 2026-06-10
modified: 2026-06-10
references:
  - https://blog.sekoia.io/fsbs-matryoshka-3-3-gamaredons-gifts-that-keeps-unpacking-gammasteel/
logsource:
  category: ps_script
  product: windows
detection:
  selection_watcher:
    ScriptBlockText|contains: 'IO.FileSystemWatcher'
  selection_recursive:
    ScriptBlockText|contains: 'IncludeSubdirectories'
  selection_raising:
    ScriptBlockText|contains: 'EnableRaisingEvents'
  selection_register:
    ScriptBlockText|contains: 'Register-ObjectEvent'
  filter_legit:
    ScriptBlockText|contains:
      - 'webpack'
      - 'nodemon'
      - 'rollup'
      - 'jest'
      - 'Pester'
  condition: selection_watcher and (selection_recursive or (selection_raising and selection_register)) and not filter_legit
falsepositives:
  - Development tools, build systems, and file synchronization utilities that use FileSystemWatcher with recursive monitoring
level: medium
tags:
  - attack.collection
  - attack.t1005
  - attack.t1074
fields:
  - ScriptBlockText
  - ComputerName
  - UserName
