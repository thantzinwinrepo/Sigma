title: GammaSteel - Hardcoded iPhone User-Agent in PowerShell Fallback Exfiltration
id: 4f7e2c9d-1b6a-4d87-d5f1-b8a4c3e6f2d7
status: experimental
description: Detects GammaSteel's fallback C2 exfiltration channel using a hardcoded iPhone 18 User-Agent string to masquerade multipart POST requests to operator-controlled servers as mobile browser traffic.
author: Thant Zin Win
date: 2026-06-10
modified: 2026-06-10
references:
  - https://blog.sekoia.io/fsbs-matryoshka-3-3-gamaredons-gifts-that-keeps-unpacking-gammasteel/
logsource:
  category: ps_script
  product: windows
detection:
  selection_useragent:
    ScriptBlockText|contains: 'iPhone; CPU iPhone OS 18_0 like Mac OS X'
  selection_web_request:
    ScriptBlockText|contains:
      - 'Invoke-WebRequest'
      - 'WebClient'
      - 'Invoke-RestMethod'
  filter_legit:
    ScriptBlockText|contains:
      - 'Invoke-Pester'
      - 'unit test'
      - 'Mock'
  condition: selection_useragent and selection_web_request and not filter_legit
falsepositives:
  - Unlikely; a hardcoded mobile User-Agent in a PowerShell web request is highly suspicious in any enterprise environment
level: high
tags:
  - attack.exfiltration
  - attack.t1041
  - attack.t1036
  - attack.command_and_control
  - attack.t1071
fields:
  - ScriptBlockText
  - ComputerName
  - UserName
