title: GammaSteel - PowerShell Exfiltrating Documents to S3-Compatible Cloud Storage
id: 6e1d4a8b-3f5c-4c96-c4e8-d7f3b2a1e5c9
status: experimental
description: Detects PowerShell making outbound connections to S3-compatible cloud storage providers used by GammaSteel as its primary exfiltration channel, including Tebi.io, Wasabi, and i3storage.
author: Thant Zin Win
date: 2026-06-10
modified: 2026-06-10
references:
  - https://blog.sekoia.io/fsbs-matryoshka-3-3-gamaredons-gifts-that-keeps-unpacking-gammasteel/
logsource:
  category: network_connection
  product: windows
detection:
  selection_process:
    Image|endswith: '\powershell.exe'
  selection_s3_providers:
    DestinationHostname|endswith:
      - 'tebi.io'
      - 'wasabisys.com'
      - 'i3storage.com'
  filter_legit:
    ParentImage|endswith:
      - '\VeeamAgent.exe'
      - '\BackupService.exe'
      - '\AcronisAgent.exe'
      - '\robocopy.exe'
      - '\rclone.exe'
  condition: selection_process and selection_s3_providers and not filter_legit
falsepositives:
  - Backup agents and cloud sync tools that use PowerShell to upload to S3-compatible storage
  - Note: User-based filtering (SYSTEM/NT AUTHORITY) was intentionally avoided — Gamaredon elevates privileges before exfiltration and may run this as SYSTEM
level: medium
tags:
  - attack.exfiltration
  - attack.t1567.002
  - attack.t1041
fields:
  - Image
  - DestinationHostname
  - DestinationPort
  - User
  - CommandLine
