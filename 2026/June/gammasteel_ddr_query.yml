title: GammaSteel - Dead Drop Resolver Queries from PowerShell for C2 Recovery
id: 8a3f5d1e-6c4b-4e98-e6a3-c9b7d4f1a8e5
status: experimental
description: Detects PowerShell querying Dead Drop Resolver platforms hardcoded in GammaSteel (Telegra.ph, Write.as, Rentry.co, Mastodon) to recover fresh C2 addresses and S3 bucket credentials when primary channels are unreachable.
author: Thant Zin Win
date: 2026-06-10
references:
  - https://blog.sekoia.io/fsbs-matryoshka-3-3-gamaredons-gifts-that-keeps-unpacking-gammasteel/
logsource:
  category: dns_query
  product: windows
detection:
  selection_process:
    Image|endswith: '\powershell.exe'
  selection_ddr_platforms:
    QueryName|contains:
      - 'telegra.ph'
      - 'write.as'
      - 'rentry.co'
      - 'mastodon.social'
  condition: selection_process and selection_ddr_platforms
falsepositives:
  - Users or scripts legitimately browsing these platforms; security researchers querying them for threat intelligence
level: medium
tags:
  - attack.command_and_control
  - attack.t1102
  - attack.t1102.001
fields:
  - QueryName
  - Image
  - User
