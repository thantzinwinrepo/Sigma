title: GammaSteel - Persistence via Run Key Pointing to HKCU\Printers Payload
id: 7d2e9b3f-1a4c-4d82-b6e0-c3f7a1d8e295
name: gammasteel_run_key_persistence
status: experimental
description: Detects GammaSteel persistence — hidden PowerShell in Run key reading payload from HKCU\Printers.
author: Thant Zin Win
date: 2026-06-10
modified: 2026-06-10
references:
  - https://blog.sekoia.io/fsbs-matryoshka-3-3-gamaredons-gifts-that-keeps-unpacking-gammasteel/
logsource:
  category: registry_event
  product: windows
detection:
  selection_run_key:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
  selection_printers_ref:
    Details|contains: '\Printers'
  selection_hidden_ps:
    Details|contains:
      - '-w hidden'
      - '-WindowStyle Hidden'
  condition: selection_run_key and selection_printers_ref and selection_hidden_ps
falsepositives:
  - No known legitimate software uses this pattern
level: critical
tags:
  - attack.persistence
  - attack.t1547.001
  - attack.t1112
fields:
  - TargetObject
  - Details
  - User
