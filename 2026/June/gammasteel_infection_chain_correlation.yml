title: GammaSteel - Full Registry-Staged Infection Chain Correlation
status: experimental
description: Correlates GammaSteel's three-stage registry-based infection chain — DPAPI staging to HKCU\Printers, Run key persistence, and hidden PowerShell execution — all on the same host within 30 minutes. This combination is unique to GammaSteel and indicates confirmed deployment. Requires a SIEM backend with stateful correlation support (e.g. Microsoft Sentinel, Elastic, Splunk) that can hold isolated events in memory for the full 30-minute timespan.
author: Thant Zin Win
date: 2026-06-10
modified: 2026-06-10
references:
  - https://blog.sekoia.io/fsbs-matryoshka-3-3-gamaredons-gifts-that-keeps-unpacking-gammasteel/
correlation:
  type: temporal
  rules:
    - gammasteel_dpapi_registry_staging
    - gammasteel_run_key_persistence
    - gammasteel_hidden_ps_registry_exec
  group-by:
    - ComputerName
  timespan: 30m
level: critical
tags:
  - attack.defense_evasion
  - attack.t1027
  - attack.t1112
  - attack.persistence
  - attack.t1547.001
  - attack.execution
  - attack.t1059.001
falsepositives:
  - None expected; this behavioral chain is unique to GammaSteel
